  <!-- Conversation dots -->
  <circle cx="188" cy="204" r="20" fill="white" opacity=".96"/>
  <circle cx="256" cy="204" r="20" fill="white" opacity=".96"/>
  <circle cx="324" cy="204" r="20" fill="white" opacity=".96"/>

  <!-- Small spark indicating ideas/topics -->
